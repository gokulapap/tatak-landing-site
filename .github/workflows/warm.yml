name: warm dynos

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: warm-dynos
  cancel-in-progress: true

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping
        run: |
          set -uo pipefail

          urls="https://app.tatak.tech/api/health https://fleet.tatak.tech/healthz https://ondc.tatak.tech/healthz https://network.tatak.tech/healthz"

          fail=0
          for url in $urls; do
            code=$(curl -sS -m 20 -o /dev/null -w '%{http_code}' "$url" || echo 000)
            printf '%-52s %s\n' "$url" "$code"
            case "$code" in
              2*|3*) ;;
              *) fail=1 ;;
            esac
          done

          exit $fail
